name: Benchmark LLM pipeline

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Single model and RAG mode to test
        required: true
        type: choice
        default: gemini-3.5-flash-lite
        options:
          - gemini-3.5-flash-lite
          - gemini-3.5-flash-lite-rag
          - gemini-3.7-flash
          - gemini-3.7-flash-rag
          - claude-sonnet-5
          - claude-sonnet-5-rag
          - gemma-4-e4b
          - gemma-4-e4b-rag
      max_records:
        description: Maximum evaluation records for the selected variant
        required: true
        type: choice
        default: "5"
        options:
          - "1"
          - "5"
          - "10"
          - "50"
          - "100"
      corpus_version:
        description: RAG corpus version already imported into Firestore
        required: true
        default: v1

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Gemma endpoint
        if: startsWith(inputs.variant, 'gemma-')
        env:
          GEMMA_ENDPOINT: ${{ vars.GEMMA_ENDPOINT }}
        run: |
          test -n "$GEMMA_ENDPOINT"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-connrefused \
            "${GEMMA_ENDPOINT%/}/v1/models"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/process/package-lock.json

      - name: Prepare public evaluation dataset
        run: python tools/datasets/prepare_public_dataset.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.CHECKMAIL_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install process dependencies
        working-directory: functions/process
        run: npm ci

      - name: Run online benchmark
        working-directory: functions/process
        env:
          BENCHMARK_VARIANT: ${{ inputs.variant }}
          BENCHMARK_MAX_RECORDS: ${{ inputs.max_records }}
          BENCHMARK_MODEL_ELIGIBLE_ONLY: "true"
          GOOGLE_CLOUD_PROJECT: ${{ secrets.CHECKMAIL_PROJECT_ID }}
          RAG_CORPUS_VERSION: ${{ inputs.corpus_version }}
          GEMMA_ENDPOINT: ${{ vars.GEMMA_ENDPOINT }}
          GEMMA_MODEL_ID: ${{ vars.GEMMA_MODEL_ID }}
          LLM_TIMEOUT_MS: "60000"
        run: npm run benchmark -- ../../datasets/generated/evaluation.jsonl benchmark-report.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkmail-benchmark-${{ inputs.variant }}-${{ inputs.corpus_version }}
          if-no-files-found: warn
          path: functions/process/benchmark-report.json
