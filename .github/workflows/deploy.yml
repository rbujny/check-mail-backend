name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: "false"
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TF_VAR_github_actions_service_account_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TF_VAR_project_id: ${{ secrets.CHECKMAIL_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.CHECKMAIL_REGION }}
      TF_VAR_db_password: ${{ secrets.CHECKMAIL_DB_PASSWORD }}
      TF_VAR_api_gateway_jwt_issuer: ${{ secrets.CHECKMAIL_API_GATEWAY_JWT_ISSUER }}
      TF_VAR_api_gateway_jwt_audience: ${{ secrets.CHECKMAIL_API_GATEWAY_JWT_AUDIENCE }}
      TF_VAR_jwt_private_key: ${{ secrets.CHECKMAIL_JWT_PRIVATE_KEY }}
      TF_VAR_jwt_key_id: ${{ secrets.CHECKMAIL_JWT_KEY_ID }}
      TF_VAR_jwt_expires_in: ${{ secrets.CHECKMAIL_JWT_EXPIRES_IN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          required=(
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            TF_VAR_github_actions_service_account_email
            TF_VAR_project_id
            TF_VAR_region
            TF_VAR_db_password
            TF_VAR_api_gateway_jwt_issuer
            TF_VAR_api_gateway_jwt_audience
            TF_VAR_jwt_private_key
            TF_VAR_jwt_key_id
            TF_VAR_jwt_expires_in
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Configure the matching GitHub Variable or CHECKMAIL_* Secret."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.CHECKMAIL_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -parallelism=1 tfplan

      - name: Setup Node.js for database migration
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/process/package-lock.json

      - name: Install process dependencies
        working-directory: ${{ github.workspace }}/functions/process
        run: npm ci

      - name: Migrate process results schema
        working-directory: ${{ github.workspace }}/functions/process
        env:
          DB_INSTANCE_CONNECTION_NAME: ${{ format('{0}:{1}:{0}-postgres', secrets.CHECKMAIL_PROJECT_ID, secrets.CHECKMAIL_REGION) }}
          DB_NAME: app
          DB_PASSWORD: ${{ secrets.CHECKMAIL_DB_PASSWORD }}
          DB_USER: check_mail_user
        run: npm run db:migrate
