name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: "false"
      CHECKMAIL_GCP_CREDENTIALS_JSON: ${{ secrets.CHECKMAIL_GCP_CREDENTIALS_JSON }}
      TF_VAR_project_id: ${{ secrets.CHECKMAIL_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.CHECKMAIL_REGION }}
      TF_VAR_db_password: ${{ secrets.CHECKMAIL_DB_PASSWORD }}
      TF_VAR_api_gateway_process_backend_url: ${{ secrets.CHECKMAIL_API_GATEWAY_PROCESS_BACKEND_URL }}
      TF_VAR_api_gateway_jwt_issuer: ${{ secrets.CHECKMAIL_API_GATEWAY_JWT_ISSUER }}
      TF_VAR_api_gateway_jwt_audience: ${{ secrets.CHECKMAIL_API_GATEWAY_JWT_AUDIENCE }}
      TF_VAR_jwt_private_key: ${{ secrets.CHECKMAIL_JWT_PRIVATE_KEY }}
      TF_VAR_jwt_key_id: ${{ secrets.CHECKMAIL_JWT_KEY_ID }}
      TF_VAR_jwt_expires_in: ${{ secrets.CHECKMAIL_JWT_EXPIRES_IN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          required=(
            CHECKMAIL_GCP_CREDENTIALS_JSON
            TF_VAR_project_id
            TF_VAR_region
            TF_VAR_db_password
            TF_VAR_api_gateway_process_backend_url
            TF_VAR_api_gateway_jwt_issuer
            TF_VAR_api_gateway_jwt_audience
            TF_VAR_jwt_private_key
            TF_VAR_jwt_key_id
            TF_VAR_jwt_expires_in
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Configure the matching CHECKMAIL_* GitHub Secret."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.CHECKMAIL_GCP_CREDENTIALS_JSON }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
