name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: "false"
      CHECKMAIL_GCP_CREDENTIALS_JSON: ${{ secrets.CHECKMAIL_GCP_CREDENTIALS_JSON }}
      TF_VAR_project_id: ${{ secrets.CHECKMAIL_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.CHECKMAIL_REGION }}
      TF_VAR_db_password: ${{ secrets.CHECKMAIL_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.CHECKMAIL_JWT_SECRET }}
      TF_VAR_jwt_issuer: ${{ secrets.CHECKMAIL_JWT_ISSUER }}
      TF_VAR_jwt_audience: ${{ secrets.CHECKMAIL_JWT_AUDIENCE }}
      TF_VAR_jwt_expires_in: ${{ secrets.CHECKMAIL_JWT_EXPIRES_IN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          required=(
            CHECKMAIL_GCP_CREDENTIALS_JSON
            TF_VAR_project_id
            TF_VAR_region
            TF_VAR_db_password
            TF_VAR_jwt_secret
            TF_VAR_jwt_issuer
            TF_VAR_jwt_audience
            TF_VAR_jwt_expires_in
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Configure the matching CHECKMAIL_* GitHub Secret."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.CHECKMAIL_GCP_CREDENTIALS_JSON }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
